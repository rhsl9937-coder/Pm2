name: Build Nintendo DS game

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build .nds in official devkitPro container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            bash -lc 'dkp-pacman -Sy --noconfirm --needed nds-dev && make clean && make'

      - name: Upload .nds artifact
        uses: actions/upload-artifact@v4
        with:
          name: princess-life-ds
          path: princess_life_ds.nds
          if-no-files-found: error
